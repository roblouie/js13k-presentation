<html>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" style="filter: invert()">
    <filter id="filter" x="-0.1%" width="100%" height="100%" primitiveUnits="objectBoundingBox">
        <feTurbulence seed="7" type="fractalNoise" baseFrequency=".005" numOctaves="5" result="n"></feTurbulence>
        <feComposite in="SourceAlpha" operator="in"></feComposite>
        <feDisplacementMap in2="n" scale="1"></feDisplacementMap>
    </filter>
    <rect id="l" width="100%" height="100%" filter="url(#filter)"></rect>

    <!--        <feDisplacementMap in2="n" scale="1"></feDisplacementMap>-->
    <!--    </filter>-->
    <!--    <rect id="l" width="100%" height="100%" filter="url(#filter)"></rect>-->

    <rect width="100%" height="100%" fill="#fff"></rect>
    <use href="#l" x="33%" y="15" transform="scale(1.5, 1.3)"></use>
    <use href="#l" x="-33%" y="15" transform="rotate(.1) scale(-1.5 1.3)"></use>
</svg>

<div>OTHER</div>
<svg style="filter: invert()"    viewBox="0 0 512 512"    xmlns="http://www.w3.org/2000/svg">
    <filter id="f2" primitiveUnits="objectBoundingBox" height="100%" width="100%" x="-0.01%" >
        <feTurbulence baseFrequency="0.005" numOctaves="5"     result="n"    seed="7"     type="fractalNoise"      />
        <feComposite in="SourceAlpha" operator="in"/>
        <feDisplacementMap in2="n" scale="0.9"/>
    </filter>
    <rect filter="url(#f2)" y="-37"  height="100%" id="m"  width="100%"  />
    <rect filter="url(#f2)" y="-14"  height="100%" id="m"  width="100%"  />
    <rect     fill="#fff"      height="100%"                          width="100%"  />
    <use href="#m" x="22%" y="42" transform="scale(2.2, 1.2)"></use>
    <use href="#m" x="-22%" y="42" transform="rotate(.1) scale(-2.2, 1.2)"></use>
    <rect fill="#777" x="220" y="230" width="50" height="50"/>
</svg>
</body>
