<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
    <filter id="bloodPattern" x="0" y="0" width="100%" height="100%">
        <feTurbulence seed="3" type="fractalNoise" baseFrequency="0.04" numOctaves="5" stitchTiles="stitch"/>
        <feMorphology operator="dilate" radius="3" />

        <feColorMatrix
                values="  0 0 0 0 -0.1
                          0.3 0.3 0.3 0.3 -0.1
                          0 0 0 0.2 -0.1
                          0 0 0 0 0.5" />
    </filter>
    <rect width="100%" height="100%" fill="#051"/>
    <rect width="100%" height="100%" filter="url(#bloodPattern)"/>
</svg>
