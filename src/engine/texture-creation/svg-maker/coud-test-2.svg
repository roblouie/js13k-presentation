    <linearGradient gradientTransform="rotate(90)" id="gradient1">
        <stop offset="0" stop-color="black"/>
        <stop offset="0.3" stop-color="white"/>
        <stop offset="0.7" stop-color="white"/>
        <stop offset="1" stop-color="black"/>
    </linearGradient>
    <mask id="mask1">
        <rect fill="url(#gradient1)" height="280" width="1024" x="0" y="200"/>
    </mask>
    <rect filter="url(#filter1)" height="280" width="1024" x="0" y="200"/>
    <filter height="100%" id="filter2" width="100%" x="0" y="0">
        <feTurbulence baseFrequency="0.005" numOctaves="5" seed="5" stitchTiles="stitch" type="fractalNoise"/>
        <feComponentTransfer color-interpolation-filters="sRGB">
            <feFuncR type="table" tableValues="1,1"/>
            <feFuncG type="table" tableValues="1,1"/>
            <feFuncB type="table" tableValues="1,1"/>
            <feFuncA type="table" tableValues="0,0,1.5"/>
        </feComponentTransfer>
    </filter>
    <linearGradient gradientTransform="rotate(90)" id="gradient2">
