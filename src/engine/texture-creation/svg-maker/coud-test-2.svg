<svg height="1024" style="background:linear-gradient(#2189d9,#11294e)" width="4096" xmlns="http://www.w3.org/2000/svg">
    <filter height="100%" id="filter0" width="100%" x="0" y="0">
        <feTurbulence baseFrequency="0.04" numOctaves="2" seed="2" stitchTiles="stitch" type="fractalNoise"/>
        <feComponentTransfer color-interpolation-filters="sRGB">
            <feFuncR type="table" tableValues="1,1"/>
            <feFuncG type="table" tableValues="1,1"/>
            <feFuncB type="table" tableValues="1,1"/>
            <feFuncA type="table" tableValues="0,0,0.3"/>
        </feComponentTransfer>
    </filter>
    <linearGradient gradientTransform="rotate(90)" id="gradient0">
        <stop offset="0" stop-color="black"/>
        <stop offset="0.3" stop-color="white"/>
        <stop offset="0.7" stop-color="white"/>
        <stop offset="1" stop-color="black"/>
    </linearGradient>
    <mask id="mask0">
        <rect fill="url(#gradient0)" height="100" width="1024" x="0" y="420"/>
    </mask>
    <rect filter="url(#filter0)" height="100" width="1024" x="0" y="420"/>
    <filter height="100%" id="filter1" width="100%" x="0" y="0">
        <feTurbulence baseFrequency="0.02" numOctaves="2" seed="2" stitchTiles="stitch" type="fractalNoise"/>
        <feComponentTransfer color-interpolation-filters="sRGB">
            <feFuncR type="table" tableValues="1,1"/>
            <feFuncG type="table" tableValues="1,1"/>
            <feFuncB type="table" tableValues="1,1"/>
            <feFuncA type="table" tableValues="0,0,0.6"/>
