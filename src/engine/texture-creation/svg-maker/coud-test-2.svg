        <stop offset="0.3" stop-color="white"/>
        <stop offset="0.7" stop-color="white"/>
        <stop offset="1" stop-color="black"/>
    </linearGradient>
    <mask id="mask2">
        <rect fill="url(#gradient2)" height="380" width="1024" x="0" y="0"/>
    </mask>
    <rect filter="url(#filter2)" height="380" width="1024" x="0" y="0"/>
    <filter height="150%" id="filter500" width="100%" x="0">
        <feTurbulence baseFrequency="0.01,0" numOctaves="3" seed="15" stitchTiles="stitch" type="fractalNoise"/>
        <feDisplacementMap in="SourceGraphic" scale="100"/>
    </filter>
    <filter id="groundPattern500" width="100%" x="0">
        <feTurbulence baseFrequency="0.02,0.01" id="test" numOctaves="3" result="noise500" seed="15"
                      stitchTiles="stitch" type="fractalNoise"/>
        <feDiffuseLighting in="noise500" lighting-color="#051" surfaceScale="12">
            <feDistantLight azimuth="45" elevation="60"/>
        </feDiffuseLighting>
        <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <g filter="url(#groundPattern500)">
        <rect filter="url(#filter500)" height="50%" width="4096" x="0" y="500"/>
    </g>
    <filter height="150%" id="filter520" width="100%" x="0">
        <feTurbulence baseFrequency="0.01,0" numOctaves="2" seed="3" stitchTiles="stitch" type="fractalNoise"/>
        <feDisplacementMap in="SourceGraphic" scale="100"/>
    </filter>
    <filter id="groundPattern520" width="100%" x="0">
        <feTurbulence baseFrequency="0.02,0.01" id="test" numOctaves="2" result="noise520" seed="3" stitchTiles="stitch"
                      type="fractalNoise"/>
        <feDiffuseLighting in="noise520" lighting-color="#071" surfaceScale="12">
            <feDistantLight azimuth="45" elevation="60"/>
        </feDiffuseLighting>
