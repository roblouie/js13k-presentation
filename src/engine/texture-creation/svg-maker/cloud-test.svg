<svg height="1024" width="1024" xmlns="http://www.w3.org/2000/svg" style="background-color: blue">
    <rect x="0" y="0" width="1024" height="1024" fill="#303"/>

    <!-- First cloud layer -->
    <filter height="100%" id="filter" width="100%" x="0" y="0">
        <feTurbulence baseFrequency="0.005" numOctaves="5" seed="5" stitchTiles="stitch" type="fractalNoise"/>
        <feComponentTransfer color-interpolation-filters="sRGB">
            <feFuncR type="table" tableValues="0.6,0.6"/>
            <feFuncG type="table" tableValues="0.6,0.6"/>
            <feFuncB type="table" tableValues="1,1"/>
            <feFuncA type="table" tableValues="0,0,0.6"/>
        </feComponentTransfer>
    </filter>
    <linearGradient id="Gradient" gradientTransform="rotate(90)">
        <stop offset="0" stop-color="black" />
        <stop offset="0.2" stop-color="white" />
        <stop offset="0.8" stop-color="white" />
        <stop offset="1" stop-color="black" />
    </linearGradient>
    <mask id="Mask">
        <rect x="0" y="0" width="1024" height="380" fill="url(#Gradient)" />
    </mask>
    <rect filter="url(#filter)" height="380" width="1024" x="0" y="0" mask="url(#Mask)"/>
</svg>
