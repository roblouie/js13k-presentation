<svg height="512" style="filter: invert()" viewBox="0 0 512 512" width="512" xmlns="http://www.w3.org/2000/svg">
    <filter height="100%" id="filter" primitiveUnits="objectBoundingBox" width="100%" x="-0.1%" y="0">
        <feTurbulence baseFrequency="0.005" numOctaves="5" result="n" seed="7" type="fractalNoise"/>
        <feComposite in="SourceAlpha" operator="in"/>
        <feDisplacementMap in2="n" scale="1"/>
    </filter>
    <rect filter="url(#filter)" height="100%" id="l" width="100%" x="0" y="0"/>
    <rect fill="#fff" height="100%" width="100%" x="0" y="0"/>
    <use href="#l" x="33%" y="15" transform="scale(1.5, 1.3)"></use>
    <use href="#l" x="-33%" y="15" transform="rotate(.1) scale(-1.5 1.3)"></use>
</svg>
