<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vuetify 3 Vite Preview</title>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512">
    <pattern id="pattern" width="128" height="128" patternUnits="userSpaceOnUse">
        <rect x="0" y="0" width="128" height="128" fill="#687A5E"/>
        <text x="64" y="64" style="font-size: 64px;" stroke="#506546" fill="#506546">❀</text>
        <text x="0" y="128" style="font-size: 50px;" stroke="#506546" fill="#506546">✦</text>

    </pattern>

    <filter id="filter">
        <feTurbulence baseFrequency=".4" stitchTiles="stitch"/>

        <feDiffuseLighting color-interpolation-filters="sRGB" surfaceScale="1" lighting-color="#687A5E">
            <feDistantLight azimuth="120" elevation="30"/>
        </feDiffuseLighting>
        <feBlend in="SourceGraphic" mode="difference"/>
    </filter>
    <rect x="0" y="0" width="100%" height="100%"  filter="url(#filter)" fill="url(#pattern)"></rect>

</svg>
</body>

<style>
    test {
        background-color: #687a5e;
        color: #506546;
    }
</style>
