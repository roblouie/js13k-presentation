<svg width="500" height="500" xmlns="http://www.w3.org/2000/svg">
    <filter id="circleDistort" height="150%">
        <feTurbulence type="fractalNoise" baseFrequency="0.1 0.005" numOctaves="1" result="noise2"/>
        <feDisplacementMap in="SourceGraphic" in2="noise2" scale="120"/>
    </filter>
    <filter id="bloodPattern">
        <feTurbulence type="fractalNoise" baseFrequency="0.15" numOctaves="1" result="noise3"/>
        <feColorMatrix
                values="  0.4 0.5 0.4 0 -0.1
                          0 2 0 0 -1.3
                          0 2 0 0 -1.3
                          1 0 0 0 1" />
        <feComposite in2="SourceGraphic" operator="in" />
    </filter>
<!--    <filter id="colorMeLTA">-->
<!--        <feColorMatrix in="SourceGraphic" type="luminanceToAlpha" />-->
<!--    </filter>-->
    <g filter="url(#circleDistort)">
    <g filter="url(#bloodPattern)">
<!--        <text font-size="100" x="10" y="300" filter="url(#colorMeLTA)" style="font-size: 160">🖐️</text>-->
<!--        <rect x="0" y="-50" width="100%" height="50%" filter="url(#circleDistort)"/>-->
        <ellipse cx="50%" cy="0" rx="50%" ry="20%"></ellipse>
    </g>
    </g>
</svg>
